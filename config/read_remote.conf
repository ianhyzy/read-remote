# Read Remote — ZMK settings
CONFIG_ZMK_KEYBOARD_NAME="Read Remote"

# Deep sleep after 30 min idle; any button wakes it.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Hold PREV 5 s to power off completely (travel); press any button to wake.
CONFIG_ZMK_PM_SOFT_OFF=y

# Silent domes bounce very little; keep latency low.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# A little extra radio power for use under a blanket.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery level shows in the host's Bluetooth settings.
CONFIG_ZMK_BATTERY_REPORTING=y
